# wrangler.toml
name = "cleaner-planner"
main = "worker.mjs"
compatibility_date = "2026-09-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

[observability.traces]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "cleaner-planner-db"
database_id = "b715ec16-be25-4da3-93fc-92cb41d53e75"
migrations_dir = "./drizzle"

[triggers]
crons = ["0 0 * * *"]
